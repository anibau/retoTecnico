server:
  port: 8083
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: complete-service
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:CinesDb};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver

security:
  jwt:
    secret: ${JWT_SECRET:secret-key-2026}
    expiration-ms: ${JWT_EXPIRATION_MS:1800000}
    issuer: premieres-service

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

payu:
  api-login: ${PAYU_API_LOGIN:pRRXKOl8ikMmt9u}
  api-key: ${PAYU_API_KEY:4Vj8eK4rloUd272L48hsrarnUA}
  merchant-id: ${PAYU_MERCHANT_ID:508029}
  account-id: ${PAYU_ACCOUNT_ID:512323}
  endpoint: ${PAYU_ENDPOINT:https://sandbox.api.payulatam.com/payments-api/4.0/service.cgi}
  payment-country: PE
  test: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health
